[project]
name = "blurr-ref"
version = "0.1.0"
description = "Outillage de reference, ingestion, verite terrain et evaluation de blurr"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python>=4.8.0",
    "deface>=1.5.0",
    "pytest>=8.0.0",
]

[project.scripts]
blurr-ref = "blurr_ref.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blurr_ref"]

[tool.pytest.ini_options]
testpaths = ["tests"]
