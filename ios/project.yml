# Projet Xcode de l'application iOS, généré par XcodeGen (`xcodegen generate` dans ce dossier).
# Le projet généré (Blurr.xcodeproj), le cadre OpenCV (Frameworks/) et l'icône (AppIcon.png) ne sont pas
# versionnés : la compilation GitHub Actions les produit (voir .github/workflows/ios.yml et ios/README.md).
name: Blurr
options:
  bundleIdPrefix: io.github.momour
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    ENABLE_BITCODE: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # En-têtes d'OpenCV : avertissements de documentation sans intérêt ici.
    CLANG_WARN_DOCUMENTATION_COMMENTS: "NO"

packages:
  BlurrCore:
    path: BlurrCore

targets:
  Blurr:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Blurr
      # Modèle YuNet (MIT), même fichier que l'application Android.
      - path: ../android/app/src/main/assets/models/face_detection_yunet_2023mar.onnx
        buildPhase: resources
    dependencies:
      - package: BlurrCore
      # OpenCV 4.14.0 pour iOS (bibliothèque statique, non embarquée), téléchargé par ios/Tools/fetch_opencv.sh.
      - framework: Frameworks/opencv2.framework
        embed: false
      - sdk: Accelerate.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreImage.framework
      - sdk: QuartzCore.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: libc++.tbd
    info:
      path: Blurr/Info.plist
      properties:
        CFBundleDisplayName: blurr
        CFBundleDevelopmentRegion: fr
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        NSPhotoLibraryAddUsageDescription: "blurr enregistre dans Photos la vidéo floutée, quand vous le demandez."
        # Vidéos produites visibles dans l'app Fichiers (Sur mon iPhone > blurr).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Blurr
        PRODUCT_BUNDLE_IDENTIFIER: io.github.momour.blurr
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Blurr/Bridge/Blurr-Bridging-Header.h
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEAD_CODE_STRIPPING: "YES"
        OTHER_CPLUSPLUSFLAGS:
          - "$(inherited)"
          - "-ffp-contract=off"

  BlurrTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BlurrTests
        excludes:
          - "Fixtures"
      # Images de test téléchargées par la compilation (absentes du dépôt).
      - path: BlurrTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Blurr
      - package: BlurrCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.momour.blurr.tests
        SWIFT_OBJC_BRIDGING_HEADER: Blurr/Bridge/Blurr-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Blurr:
    build:
      targets:
        Blurr: all
        BlurrTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - BlurrTests
    archive:
      config: Release
